<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Enquête pénibilité</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--txt:#111827;--mut:#6b7280;--bd:#d1d5db;--pri:#1f2937;--h1:#2563eb;--h2:#d97706;--ok:#059669;--warn:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
header{position:sticky;top:0;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{padding:16px;max-width:560px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.box{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:600;background:var(--pri);color:#fff;margin-top:10px}
.btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.warn{background:#fff;color:var(--warn);border:1.5px solid var(--warn)}
.btn:disabled{opacity:.4}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-family:inherit}
textarea{min-height:90px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.list .it:last-child{border-bottom:0}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e5e7eb}
.tag.ok{background:#d1fae5;color:#065f46}.tag.enc{background:#fef3c7;color:#92400e}
.q{font-size:20px;font-weight:700;text-align:center;margin:4px 0 14px}
.prog{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog>div{height:100%;background:var(--ok);transition:width .2s}
.pair{display:flex;flex-direction:column;gap:12px}
.sit{background:#fff;border:3px solid var(--bd);border-radius:14px;padding:16px;text-align:center;font-size:inherit;font-family:inherit;color:inherit;width:100%}
.sit:active{transform:scale(.98)}
.sit .hall{display:inline-block;color:#fff;font-weight:700;font-size:14px;border-radius:6px;padding:3px 10px}
.sit .d{font-size:44px;font-weight:900;line-height:1.1;margin:6px 0}
.sit .m{font-size:18px;font-weight:700}
.sit .m.two{color:var(--warn)}
.sit .lines{display:flex;justify-content:center;gap:6px;margin-top:6px}
.sit .lines span{width:28px;height:28px;border-radius:6px;background:var(--pri)}
.vs{text-align:center;font-weight:800;color:var(--mut);margin:-4px 0}
.small{display:flex;gap:8px;margin-top:12px}
.small button{flex:1;border-radius:10px;padding:12px 6px;font-size:15px;font-weight:600;border:1.5px solid var(--bd);background:#fff;color:var(--txt)}
.small .eq{border-color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .box{max-width:420px;width:100%}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--pri);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<header><h1 id="titre">Enquête pénibilité</h1><button id="btnHeader" class="hide"></button></header>
<main id="app"></main>
<div id="modal" class="modal hide"><div class="box"><div id="modalTxt"></div><div class="row"><button class="btn sec" id="modalNo">Annuler</button><button class="btn" id="modalYes">Confirmer</button></div></div></div>
<div id="toast" class="toast hide"></div>

<script>
"use strict";
/* ================= Données et stockage ================= */
const CLE = "enquete_penibilite_v1";
const SITUATIONS_DEFAUT = [
  "1;7z;1","1;8z;1","1;9z;1",
  "2;4,5;1","2;5,5;1","2;6z;1","2;7z;1",
  "1;7z;2","2;4,5;2","2;7z;2"
].join("\n");
const QUESTION_DEFAUT = "Laquelle est la plus pénible sur un poste ?";

let memoire = null; // repli si le stockage du navigateur est indisponible
function charger(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(CLE)); } catch(e) {}
  if (!s && memoire) s = memoire;
  if (!s) s = {};
  s.entretiens = s.entretiens || [];
  s.situationsTxt = s.situationsTxt || SITUATIONS_DEFAUT;
  s.nbQuestions = s.nbQuestions || 20;
  s.controle = (s.controle === undefined) ? true : s.controle;
  s.question = s.question || QUESTION_DEFAUT;
  return s;
}
function sauver(){
  memoire = S;
  try { localStorage.setItem(CLE, JSON.stringify(S)); } catch(e) {}
}
let S = charger();

function situations(){
  const out = [];
  S.situationsTxt.split(/\r?\n/).forEach(l => {
    const p = l.split(";").map(x => x.trim());
    if (p.length < 3 || !p[1]) return;
    const hall = p[0].replace(/\D/g, "") || "1";
    const lignes = p[2] === "2" ? 2 : 1;
    const id = "H" + hall + "-" + p[1] + "-" + lignes + "L";
    if (!out.some(x => x.id === id)) out.push({id, hall, diam: p[1], lignes});
  });
  return out;
}
function sitParId(id){ return situations().find(s => s.id === id); }
const cle = (a, b) => a < b ? a + "|" + b : b + "|" + a;

/* ================= Tirage équilibré des paires ================= */
function compteurs(){
  const c = {};
  S.entretiens.forEach(e => e.reponses.forEach(r => {
    if (r.c === "?") return;
    const k = cle(r.g, r.d); c[k] = (c[k] || 0) + 1;
  }));
  return c;
}
function tirerPaires(){
  const sits = situations().map(s => s.id);
  const toutes = [];
  for (let i = 0; i < sits.length; i++) for (let j = i + 1; j < sits.length; j++) toutes.push([sits[i], sits[j]]);
  const nbCtrl = (S.controle && S.nbQuestions >= 6) ? 1 : 0;
  const n = Math.min(S.nbQuestions - nbCtrl, toutes.length);
  const glob = compteurs(), usage = {}, prises = new Set(), liste = [];
  for (let q = 0; q < n; q++){
    let best = null, bestScore = Infinity;
    toutes.forEach(p => {
      const k = cle(p[0], p[1]);
      if (prises.has(k)) return;
      const sc = (glob[k] || 0) * 10 + (usage[p[0]] || 0) + (usage[p[1]] || 0) + Math.random() * 0.9;
      if (sc < bestScore){ bestScore = sc; best = p; }
    });
    if (!best) break;
    const k = cle(best[0], best[1]);
    prises.add(k); glob[k] = (glob[k] || 0) + 1;
    usage[best[0]] = (usage[best[0]] || 0) + 1; usage[best[1]] = (usage[best[1]] || 0) + 1;
    const inv = Math.random() < 0.5;
    liste.push({g: inv ? best[1] : best[0], d: inv ? best[0] : best[1], ctrl: 0});
  }
  // mélange de l'ordre des questions
  for (let i = liste.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [liste[i], liste[j]] = [liste[j], liste[i]]; }
  // question de contrôle : une paire de la première moitié reposée à la fin, côtés inversés
  if (nbCtrl && liste.length >= 4){
    const src = liste[Math.floor(Math.random() * Math.floor(liste.length / 2))];
    liste.push({g: src.d, d: src.g, ctrl: 1});
  }
  return liste;
}

/* ================= Utilitaires d'interface ================= */
const $ = id => document.getElementById(id);
const app = $("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hide"), 2200); }
function confirmer(html, ok, libelle){
  $("modalTxt").innerHTML = html; $("modalYes").textContent = libelle || "Confirmer";
  $("modal").classList.remove("hide");
  $("modalYes").onclick = () => { $("modal").classList.add("hide"); ok(); };
  $("modalNo").onclick = () => $("modal").classList.add("hide");
}
function entete(titre, btn, action){
  $("titre").textContent = titre;
  const b = $("btnHeader");
  if (btn){ b.textContent = btn; b.classList.remove("hide"); b.onclick = action; } else b.classList.add("hide");
}
const fini = e => e.reponses.length >= e.paires.length;

/* ================= Écran d'accueil ================= */
function accueil(){
  entete("Enquête pénibilité", "Réglages", reglages);
  const termines = S.entretiens.filter(fini).length;
  const nbRep = S.entretiens.reduce((t, e) => t + e.reponses.filter(r => r.c !== "?").length, 0);
  let h = `<div class="box"><div class="row" style="text-align:center">
    <div><div style="font-size:28px;font-weight:800">${termines}</div><div class="mut">opérateurs terminés</div></div>
    <div><div style="font-size:28px;font-weight:800">${nbRep}</div><div class="mut">comparaisons</div></div></div>
    <button class="btn" id="bNouveau">+ Nouvel opérateur</button></div>`;
  if (S.entretiens.length){
    h += `<div class="box"><div class="list">`;
    S.entretiens.slice().reverse().forEach(e => {
      const f = fini(e);
      h += `<div class="it" data-id="${e.id}"><div><b>${esc(e.code)}</b> <span class="mut">· équipe ${esc(e.equipe || "–")} · ${esc(e.date)}</span></div>
        <span class="tag ${f ? "ok" : "enc"}">${f ? "terminé" : e.reponses.length + "/" + e.paires.length}</span></div>`;
    });
    h += `</div><p class="mut">Touchez un entretien en cours pour le reprendre.</p></div>`;
    h += `<div class="box"><button class="btn" id="bExport">Exporter les réponses (CSV)</button>
      <button class="btn sec" id="bCouv">Voir la couverture des paires</button></div>`;
  } else {
    h += `<div class="box mut">Aucun entretien pour l'instant. Vérifiez la liste des situations dans <b>Réglages</b> avant de commencer.</div>`;
  }
  app.innerHTML = h;
  $("bNouveau").onclick = nouveau;
  if ($("bExport")) $("bExport").onclick = exporter;
  if ($("bCouv")) $("bCouv").onclick = couverture;
  app.querySelectorAll(".it").forEach(el => el.onclick = () => {
    const e = S.entretiens.find(x => x.id === el.dataset.id);
    if (!fini(e)) questionner(e);
    else confirmer(`<p><b>${esc(e.code)}</b> est terminé.</p><p class="mut">Supprimer cet entretien ?</p>`, () => {
      S.entretiens = S.entretiens.filter(x => x !== e); sauver(); accueil();
    }, "Supprimer");
  });
}

/* ================= Nouvel entretien ================= */
function nouveau(){
  if (situations().length < 3){ toast("Il faut au moins 3 situations (Réglages)"); return; }
  entete("Nouvel opérateur", "Retour", accueil);
  const num = S.entretiens.length + 1;
  app.innerHTML = `<div class="box">
    <label>Code opérateur (anonyme)</label><input id="code" value="Op ${num}">
    <label>Équipe</label><select id="eq"><option value="">–</option><option>1</option><option>2</option><option>3</option></select>
    <label>Hall habituel</label><select id="hall"><option value="">–</option><option value="1">Hall 1</option><option value="2">Hall 2</option><option value="1+2">Les deux</option></select>
    <p class="mut">Ne saisissez pas de nom : le fichier exporté doit rester anonyme.</p>
    <button class="btn" id="go">Commencer (${S.nbQuestions} questions)</button></div>`;
  $("go").onclick = () => {
    const e = {
      id: Date.now().toString(36), code: $("code").value.trim() || ("Op " + num),
      equipe: $("eq").value, hall: $("hall").value,
      date: new Date().toLocaleDateString("fr-FR"), paires: tirerPaires(), reponses: [], note: ""
    };
    S.entretiens.push(e); sauver(); questionner(e);
  };
}

/* ================= Questions ================= */
function carte(s, cote){
  if (!s) return `<button class="sit" data-c="${cote}">Situation supprimée</button>`;
  const coul = s.hall === "1" ? "var(--h1)" : "var(--h2)";
  return `<button class="sit" data-c="${cote}" style="border-color:${coul}">
    <span class="hall" style="background:${coul}">HALL ${esc(s.hall)}</span>
    <div class="d">Ø ${esc(s.diam)}</div>
    <div class="m ${s.lignes === 2 ? "two" : ""}">${s.lignes === 2 ? "2 lignes" : "1 ligne"}</div>
    <div class="lines">${s.lignes === 2 ? "<span></span><span></span>" : "<span></span>"}</div></button>`;
}
function questionner(e){
  if (fini(e)) return finEntretien(e);
  entete(e.code, "Pause", accueil);
  const i = e.reponses.length, p = e.paires[i];
  const g = sitParId(p.g), d = sitParId(p.d);
  app.innerHTML = `<div class="prog"><div style="width:${100 * i / e.paires.length}%"></div></div>
    <div class="mut" style="text-align:center">Question ${i + 1} / ${e.paires.length}</div>
    <div class="q">${esc(S.question)}</div>
    <div class="pair">${carte(g, "g")}<div class="vs">ou</div>${carte(d, "d")}</div>
    <div class="small">
      <button id="bAnn" ${i ? "" : "disabled"}>↶ Annuler</button>
      <button class="eq" id="bEq">Équivalent</button>
      <button id="bNsp">Ne sait pas</button></div>`;
  const repondre = c => {
    e.reponses.push({n: i + 1, g: p.g, d: p.d, c, ctrl: p.ctrl, t: new Date().toISOString()});
    sauver(); questionner(e);
  };
  app.querySelectorAll(".sit").forEach(b => b.onclick = () => repondre(b.dataset.c === "g" ? p.g : p.d));
  $("bEq").onclick = () => repondre("=");
  $("bNsp").onclick = () => repondre("?");
  $("bAnn").onclick = () => { e.reponses.pop(); sauver(); questionner(e); };
}
function finEntretien(e){
  entete(e.code, null);
  app.innerHTML = `<div class="box"><h2 style="margin-top:0">Terminé ✔</h2>
    <label>Remarque de l'opérateur (facultatif)</label><textarea id="note">${esc(e.note || "")}</textarea>
    <p class="mut">Pas de nom ni d'information personnelle.</p>
    <button class="btn" id="ok">Enregistrer et revenir</button>
    <button class="btn sec" id="ann">↶ Corriger la dernière réponse</button></div>`;
  $("ok").onclick = () => { e.note = $("note").value.trim(); sauver(); toast("Entretien enregistré"); accueil(); };
  $("ann").onclick = () => { e.reponses.pop(); sauver(); questionner(e); };
}

/* ================= Couverture ================= */
function couverture(){
  entete("Couverture", "Retour", accueil);
  const sits = situations(), c = compteurs(), apparitions = {};
  let paires = 0, vides = 0, mini = Infinity;
  for (let i = 0; i < sits.length; i++) for (let j = i + 1; j < sits.length; j++){
    const n = c[cle(sits[i].id, sits[j].id)] || 0; paires++; if (!n) vides++; mini = Math.min(mini, n);
  }
  Object.entries(c).forEach(([k, n]) => k.split("|").forEach(id => apparitions[id] = (apparitions[id] || 0) + n));
  let h = `<div class="box"><p><b>${paires}</b> paires possibles · <b>${vides}</b> jamais posées · minimum <b>${mini === Infinity ? 0 : mini}</b> réponse(s) par paire.</p>
    <p class="mut">Les nouveaux entretiens donnent la priorité aux paires les moins posées.</p></div>
    <div class="box"><table><tr><th>Situation</th><th>Comparaisons</th></tr>`;
  sits.forEach(s => h += `<tr><td>Hall ${esc(s.hall)} · Ø ${esc(s.diam)} · ${s.lignes} ligne${s.lignes > 1 ? "s" : ""}</td><td>${apparitions[s.id] || 0}</td></tr>`);
  app.innerHTML = h + `</table></div>`;
}

/* ================= Export CSV ================= */
function csv(){
  const L = ["Operateur;Equipe;HallHabituel;Date;Question;Gauche;Droite;Choix;Controle;Horodatage;Remarque"];
  const q = v => { v = String(v ?? ""); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  S.entretiens.forEach(e => e.reponses.forEach(r => L.push([e.code, e.equipe, e.hall, e.date, r.n, r.g, r.d, r.c, r.ctrl, r.t, r.n === 1 ? e.note : ""].map(q).join(";"))));
  return "﻿" + L.join("\r\n");
}
async function exporter(){
  const nom = "penibilite_" + new Date().toISOString().slice(0, 10) + ".csv";
  const contenu = csv();
  const fichier = new File([contenu], nom, {type: "text/csv"});
  try {
    if (navigator.canShare && navigator.canShare({files: [fichier]})){ await navigator.share({files: [fichier], title: nom}); return; }
  } catch(err){ if (err && err.name === "AbortError") return; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(fichier); a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Fichier téléchargé");
  } catch(err){
    try { await navigator.clipboard.writeText(contenu); toast("CSV copié dans le presse-papiers"); }
    catch(e2){ toast("Export impossible"); }
  }
}

/* ================= Réglages ================= */
function reglages(){
  entete("Réglages", "Retour", accueil);
  const verrou = S.entretiens.length > 0;
  app.innerHTML = `<div class="box">
    <label>Situations (une par ligne : hall;diamètre;lignes)</label>
    <textarea id="sits" style="min-height:220px;font-family:monospace">${esc(S.situationsTxt)}</textarea>
    <p class="mut">Ex. <code>2;5,5;2</code> = hall 2, Ø5,5, 2 lignes. ${verrou ? "<b>Attention :</b> des entretiens existent déjà. Modifier la liste maintenant rend l'analyse moins fiable." : ""}</p>
    <label>Nombre de questions par opérateur</label><input id="nb" type="number" min="5" max="60" value="${S.nbQuestions}">
    <label class="row" style="text-transform:none;font-size:15px;color:var(--txt)"><input id="ctrl" type="checkbox" style="width:auto;flex:0" ${S.controle ? "checked" : ""}> Inclure 1 question de contrôle (paire reposée)</label>
    <label>Texte de la question</label><input id="qt" value="${esc(S.question)}">
    <button class="btn" id="save">Enregistrer</button></div>
    <div class="box"><button class="btn warn" id="raz">Effacer tous les entretiens</button>
    <p class="mut">Exportez le CSV avant d'effacer.</p></div>`;
  $("save").onclick = () => {
    const ancien = S.situationsTxt;
    S.situationsTxt = $("sits").value.trim() || SITUATIONS_DEFAUT;
    if (situations().length < 3){ S.situationsTxt = ancien; toast("Il faut au moins 3 situations valides"); return; }
    S.nbQuestions = Math.max(5, Math.min(60, parseInt($("nb").value, 10) || 20));
    S.controle = $("ctrl").checked;
    S.question = $("qt").value.trim() || QUESTION_DEFAUT;
    sauver(); toast("Réglages enregistrés"); accueil();
  };
  $("raz").onclick = () => confirmer("<p><b>Effacer tous les entretiens ?</b></p><p class='mut'>Cette action est définitive.</p>", () => {
    S.entretiens = []; sauver(); toast("Entretiens effacés"); accueil();
  }, "Effacer");
}

accueil();
</script>
</body>
</html>
